<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/9db0402647.js" crossorigin="anonymous"></script>
    <title>Music Player</title>
    <link rel="stylesheet" href="styles.css">
    <script src="data.js"></script>
</head>

<body>
    <main class="container">
        <section id="player">
            <audio src="" id="audio"></audio>
            <div class="header">
                <div class="share">
                    <i class="fa-solid fa-up-right-from-square"></i>
                </div>
                <h1 class="nowplaying">NOW PLAYING</h1>
                <div class="heart">
                    <i class="fa-solid fa-heart"></i>
                </div>
            </div>

            <div class="details">
                <div class="track-art"></div>
                <div class="track-title">Track Title</div>
                <div class="track-artist">Track Artist</div>
            </div>

            <div class="slider">
                <div class="current-time">00:00</div>
                <input type="range" min="1" max="100" value="0" class="seek-slider" onchange="seekTo()">
                <div class="total-duration">00:00</div>
            </div>

            <div class="buttons">
                <button class="shuffle" onclick="shuffleTrack()">
                    <i class="fa-solid fa-shuffle fa-2x"></i>
                </button>
                <button class="prev" onclick="prevTrack()">
                    <i class="fa-solid fa-backward fa-2x"></i>
                </button>
                <button class="playpause" onclick="playTrack()">
                    <i class="fa-regular fa-circle-play fa-4x" onclick="changeIcon(this)"></i>
                    <!-- <i class="fa-regular fa-circle-pause"></i> -->
                </button>
                <button class="next" onclick="nextTrack()">
                    <i class="fa-solid fa-forward fa-2x"></i>
                </button>
                <button class="list">
                    <i class="fa-solid fa-list-ul fa-2x"></i>
                </button>
            </div>
        </section>
    </main>

    <footer>
        <a href="https://unsplash.com/" class="img">Images from Unsplash</a>
        <a href="https://pixabay.com/" class="music">Music from Pixabay</a>
    </footer>
</body>

</html>
